name: Deploy lens gallery to GitHub Pages

# The site is the static docs/ folder. The repository holds ~20 GB of images and
# .fits files, so only docs/ is checked out (blobless, sparse) and published; the
# pages link to the data files on raw.githubusercontent.com.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout docs/ only
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs
          filter: blob:none

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
